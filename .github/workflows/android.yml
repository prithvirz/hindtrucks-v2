name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build-driver:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App (mock mode — standalone, no backend/SMS needed)
      run: npm run build:demo

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Driver APK
      uses: actions/upload-artifact@v4
      with:
        name: driver-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

  build-customer:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Customer Web App (mock mode — standalone)
      run: npm run build:demo -w @hindtrucks/customer

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Capacitor (customer)
      run: cd customer && npx cap sync android

    - name: Build Customer Android APK
      run: |
        cd customer/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Customer APK
      uses: actions/upload-artifact@v4
      with:
        name: customer-debug-apk
        path: customer/android/app/build/outputs/apk/debug/app-debug.apk
